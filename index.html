<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Void Runner</title>
  <link rel="icon" type="image/svg+xml" href="./public/favicon.svg" />
  <meta name="theme-color" content="#04060f" />
  <meta name="vr-build" content="dev" /> <!-- ST-319 (I348): build stamps this to prod in dist/ -->
  <link rel="manifest" href="./public/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./public/icon-512.png" />
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three.module.js",
      "three/addons/": "./vendor/jsm/"
    }
  }
  </script>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #04060f; }
    #app { position: fixed; inset: 0; }
    canvas { display: block; }
    #flash { position: fixed; inset: 0; pointer-events: none; background: #ff5040; opacity: 0; z-index: 5; }
    #vignette { position: fixed; inset: 0; pointer-events: none; z-index: 3; background: radial-gradient(ellipse 75% 75% at center, rgba(0,0,0,0) 52%, rgba(4,6,15,0.62) 100%); }
    #vignette-danger { position: fixed; inset: 0; pointer-events: none; z-index: 4; opacity: 0; background: radial-gradient(ellipse 72% 72% at center, rgba(255,45,30,0) 42%, rgba(150,12,8,0.78) 100%); }
    #slowmo-tint { position: fixed; inset: 0; pointer-events: none; z-index: 4; opacity: 0; background: radial-gradient(ellipse 80% 80% at center, rgba(60,160,255,0) 30%, rgba(40,120,255,0.55) 100%); }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="flash"></div>
  <div id="vignette"></div>
  <div id="vignette-danger"></div>
  <div id="slowmo-tint"></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
